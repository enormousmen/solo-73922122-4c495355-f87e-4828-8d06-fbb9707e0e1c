services:
  recorder:
    build: .
    ports:
      - "8000:8000"
    environment:
      # 启动配置的物理槽位数；也是在线调容上限的最大值。
      # 演示用小数值让覆盖/调容更快发生。
      SLOT_COUNT: "4"
      DATA_DIR: /data
    volumes:
      - recdata:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 5s

volumes:
  recdata:
